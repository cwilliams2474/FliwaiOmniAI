name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests backend/tests_test_*.py
      - run: python -m compileall -q backend/app
      - run: bash -n scripts/backup.sh scripts/verify-backup.sh scripts/restore.sh scripts/smoke-test.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment
        run: |
          cat > .env <<'ENV'
          APP_NAME=FLIWAI OmniAI API
          ENVIRONMENT=development
          POSTGRES_USER=omniai
          POSTGRES_PASSWORD=ci_database_password_12345
          POSTGRES_DB=omniai
          DATABASE_URL=postgresql://omniai:ci_database_password_12345@db:5432/omniai
          JWT_SECRET=ci_only_release_candidate_secret_please_replace
          JWT_EXPIRE_MINUTES=60
          OPENAI_API_KEY=
          CORS_ORIGINS=http://localhost:3000
          UPLOAD_DIR=/app/uploads
          RATE_LIMIT_PER_MINUTE=500
          APP_BASE_URL=http://localhost:3000
          ENV
      - name: Start application
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in {1..36}; do
            if curl --fail --silent http://localhost:8000/health/ready; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e:chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v
